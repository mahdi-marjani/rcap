[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rcap"
version = "1.0.1"
description = "reCAPTCHA v2 Image Solver using YOLO and Selenium"
authors = [{name = "Mahdi Marjani", email = "mahdi.marjani.dev@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rcap-core>=2.0.1,<3",
    "rcap-client>=2.0.0,<3",
]

[tool.setuptools]
packages = ["rcap"]

[project.urls]
Homepage = "https://github.com/mahdi-marjani/rcap"
Documentation = "https://github.com/mahdi-marjani/rcap"
Repository = "https://github.com/mahdi-marjani/rcap.git"
Issues = "https://github.com/mahdi-marjani/rcap/issues"